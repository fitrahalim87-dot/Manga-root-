<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Suppress Vite HMR WebSocket errors in AI Studio iframe environment
      window.addEventListener('error', function(e) {
        if (e && e.message && e.message.includes('WebSocket')) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (e && e.reason && e.reason.message && e.reason.message.includes('WebSocket')) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Mangaroot - Manga Recap Studio</title>
    <meta name="description" content="Generator naskah video recap manga otomatis untuk YouTube. Upload manga, urutkan otomatis, dan generate VO script siap pakai menggunakan AI." />
    
    <!-- Open Graph / Social Sharing -->
    <meta property="og:title" content="Mangaroot - Manga Recap Studio" />
    <meta property="og:description" content="Generator naskah video recap manga otomatis untuk YouTube. Upload manga, urutkan otomatis, dan generate VO script siap pakai menggunakan AI." />
    <meta property="og:type" content="website" />
    
    <!-- PWA & Mobile Web App Meta -->
    <meta name="theme-color" content="#030712" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mangaroot" />
    <meta name="application-name" content="Mangaroot" />
    
    <!-- Icons & Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
  </head>
  <body class="bg-[#030712] text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
