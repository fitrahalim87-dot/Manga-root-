<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="mangaroot-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="mangaroot-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="accent-sparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep dark app background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#mangaroot-bg)" />
  <rect width="506" height="506" x="3" y="3" rx="109" fill="none" stroke="#1e293b" stroke-width="6" />

  <!-- Outer subtle glowing ring -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#mangaroot-grad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Central badge circular shield -->
  <circle cx="256" cy="256" r="156" fill="url(#mangaroot-grad)" filter="url(#glow)" />
  <circle cx="256" cy="256" r="156" fill="url(#mangaroot-grad)" />

  <!-- Inner dark contrasting card for crisp iconography -->
  <circle cx="256" cy="256" r="140" fill="#090d16" />

  <!-- Manga Book Pages + Rec-Studio Ribbon Graphic -->
  <!-- Left Page -->
  <path d="M 180 180 C 210 170 240 180 256 195 L 256 335 C 240 320 210 310 180 320 Z" fill="#ffffff" fill-opacity="0.95" />
  <!-- Right Page -->
  <path d="M 332 180 C 302 170 272 180 256 195 L 256 335 C 272 320 302 310 332 320 Z" fill="#e2e8f0" />

  <!-- Stylized Manga Action lines on left page -->
  <line x1="200" y1="215" x2="242" y2="225" stroke="#6366f1" stroke-width="4" stroke-linecap="round" />
  <line x1="200" y1="245" x2="242" y2="255" stroke="#6366f1" stroke-width="4" stroke-linecap="round" />
  <line x1="200" y1="275" x2="236" y2="285" stroke="#6366f1" stroke-width="4" stroke-linecap="round" />

  <!-- Play / Recap Studio Arrow on right page -->
  <polygon points="280,230 312,250 280,270" fill="url(#mangaroot-grad)" />

  <!-- Top Right AI Magic Sparkle -->
  <path d="M 345 135 Q 365 155 385 155 Q 365 155 345 175 Q 345 155 325 155 Q 345 155 345 135 Z" fill="#22d3ee" filter="url(#glow)" />
  <path d="M 345 135 Q 365 155 385 155 Q 365 155 345 175 Q 345 155 325 155 Q 345 155 345 135 Z" fill="#ffffff" />

  <!-- Bottom Left Secondary Rose Sparkle -->
  <path d="M 145 350 Q 157 362 169 362 Q 157 362 145 374 Q 145 362 133 362 Q 145 362 145 350 Z" fill="url(#accent-sparkle)" />
</svg>
